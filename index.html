<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Used Car Dealership</title>

        <link rel="stylesheet" href="css/styles.css">

        <script src="js/data.js"></script>
        <script src="js/main.js"></script>

    </head>

    <body>

        <header>
            <h1>Used Car Dealership</h1>
        </header>

        <main>

            <section class="filters">

                <h2>Filter Cars</h2>

                <label>Min Year</label>
                <input type="number" id="minYear">

                <label>Max Year</label>
                <input type="number" id="maxYear">

                <label>Max Mileage</label>
                <input type="number" id="maxMileage">

                <label>Min Price</label>
                <input type="number" id="minPrice">

                <label>Max Price</label>
                <input type="number" id="maxPrice">

                <label>Make</label>
                <select id="make" multiple>

                    <option value="Toyota">Toyota</option>
                    <option value="Honda">Honda</option>
                    <option value="Ford">Ford</option>
                    <option value="Nissan">Nissan</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Volkswagen">Volkswagen</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Subaru">Subaru</option>
                    <option value="Mazda">Mazda</option>
                    <option value="Kia">Kia</option>
                    <option value="Dodge">Dodge</option>
                    <option value="Cadillac">Cadillac</option>
                    <option value="Jaguar">Jaguar</option>
                    <option value="Tesla">Tesla</option>
                    <option value="Porsche">Porsche</option>
                    <option value="Lexus">Lexus</option>
                    <option value="BMW">BMW</option>

                </select>

                <label>Color</label>
                <select id="color" multiple>

                    <option value="Silver">Silver</option>
                    <option value="White">White</option>
                    <option value="Black">Black</option>
                    <option value="Blue">Blue</option>
                    <option value="Red">Red</option>
                    <option value="Gray">Gray</option>
                    <option value="Green">Green</option>

                </select>

                <button onclick="filterCars()">Apply Filters</button>
                
            </section>

            <section>
                
                <h2>Available Cars</h2>

                <p id="noResults"></p>

                <div id="carContainer"></div>

            </section>

        </main>

    <footer>
        <p>Used Car Dealership © 2026</p>
    </footer>

</body>
</html>
